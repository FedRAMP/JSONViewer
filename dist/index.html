<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>FedRAMP Document Viewer</title>
  <script type="module" crossorigin src="/assets/index-BqZ5fNT0.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CsLMpdko.css">
</head>
<body>
  <nav class="toolbar">
    <span class="brand">FedRAMP Document Viewer</span>
    <input id="file-input" type="file" accept=".json,application/json" hidden/>
    <button id="open-btn" type="button" class="btn btn-primary" disabled>Open JSON File</button>
    <label class="schema-label" for="schema-select">Document type</label>
    <select id="schema-select" disabled></select>
    <span id="file-name" class="file-name"></span>
  </nav>
  <main id="main">
    <div id="status" class="status">Loading schemas…</div>
    <div id="drop-hint" class="drop-hint" hidden>
      <p><strong>Open a FedRAMP JSON file</strong> to view it as a formatted document.</p>
      <p class="muted">Use the <em>Open JSON File</em> button or drag and drop a file anywhere on this page.
        The document type is detected automatically; change it with the dropdown if the guess is wrong.</p>
    </div>
    <!-- Empty sandbox blocks all scripting: the rendered HTML comes from an
         untrusted, user-supplied JSON file. -->
    <iframe id="preview" title="Document preview" data-testid="html-preview-iframe" sandbox="" hidden></iframe>
  </main>
</body>
</html>
